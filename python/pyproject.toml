[project]
name = "pinn-pde-solver"
version = "0.1.0"
description = "Physics-informed neural network PDE solver with an Azure ML MLOps pipeline: training, evaluation gate, model registry, managed endpoint"
requires-python = ">=3.12,<3.13"
dependencies = [
    "jax>=0.4.30",
    "equinox>=0.11",
    "optax>=0.2",
    "matplotlib>=3.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pinn", "mlops"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pyyaml>=6",
]
mlops = [
    "mlflow>=2.0",
    "azure-ai-ml>=1.0",
    "azure-identity>=1.0",
]
