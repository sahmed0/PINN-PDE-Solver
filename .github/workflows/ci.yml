name: CI

# Push CI proves the offline story on every change: the Python suite (offline,
# Azure mocked) + ruff lint, and the frontend lint + production build.
#
# Lint is ruff check only - deliberately no `ruff format`. Reformatting the whole
# codebase would destroy git blame and produce a giant no-op diff.

on:
  push:
    branches: [main]
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: python
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4
        with:
          python-version: "3.12"
      - run: uv sync --group dev --group mlops
      - run: uv run ruff check .
      - run: uv run pytest -m "not slow"

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm build
