# Conda spec for the Azure ML TRAINING environment.
# Referenced by environment.yml (conda_file). Versions pinned to the local
# python/uv.lock for cloud↔local reproducibility. CPU only — no GPU, no TensorFlow/ONNX.
name: pinn-heat-train
channels:
  - conda-forge
dependencies:
  - python=3.12
  - pip>=24.0
  - numpy=2.4.6
  - pip:
      - jax[cpu]==0.10.1
      - equinox==0.13.8
      - optax==0.2.8
      - matplotlib==3.11.0
      # Pinned to the local uv.lock (3.14.0). Historically this was ceilinged at
      # <2.9 because mlflow 2.9 began passing tracking_uri= into artifact-repository
      # builders, which older azureml-mlflow rejected (TypeError on
      # azureml_artifacts_builder). That pairing is now validated by the training-env
      # Docker smoke test (README §0), not a version ceiling.
      - mlflow==3.14.0
      # azureml-mlflow makes `mlflow` auto-point at the workspace tracking URI
      # inside an Azure ML job. Without it the run's metrics/artefacts will NOT be
      # captured by the workspace. Not in the local uv.lock (cloud-only dep) — its
      # version resolves at provision time and is guarded by the Docker smoke test.
      - azureml-mlflow
      # The gate job runs `gate.py --register`, which uses the Azure ML
      # SDK to promote a passing model to the Model Registry.
      - azure-ai-ml==1.34.0
      - azure-identity==1.25.3
